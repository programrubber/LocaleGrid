<svg viewBox="0 0 920 360" width="100%" height="100%" role="img" aria-labelledby="uni-title uni-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="uni-title">유니코드 문자 체계 검증 엔진 처리 흐름도</title>
  <desc id="uni-desc">입력된 번역 텍스트에 대해 공통 기호 필터링, 로케일 스크립트 정책 매칭, 정규식 캐시 검사 및 위반 시 실시간 진단 메시지 생성 흐름을 나타냅니다.</desc>
  <defs>
    <marker id="arr-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
    <marker id="arr-green2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <marker id="arr-red2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="360" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />

  <!-- Step 1: Input -->
  <g transform="translate(32, 40)">
    <rect width="144" height="76" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
    <text x="24" y="34" fill="#0f172a" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">번역 셀 텍스트</text>
    <text x="24" y="58" fill="#475569" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12">사용자 입력 / 파일 로드</text>
  </g>

  <path d="M 176 78 H 220" fill="none" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr-flow)" />

  <!-- Step 2: Common Filter -->
  <g transform="translate(224, 32)">
    <polygon points="92,0 184,46 92,92 0,46" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2" />
    <text x="92" y="42" fill="#2563eb" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">공통 기호 검사</text>
    <text x="92" y="60" fill="#475569" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">구두점, 숫자, 이모지</text>
  </g>

  <!-- Pass branch from Common Filter -->
  <path d="M 316 32 V 16 H 796 V 64" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arr-green2)" />
  <rect x="500" y="8" width="112" height="20" rx="4" fill="#ffffff" stroke="#bbf7d0" />
  <text x="556" y="22" fill="#16a34a" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">공통 문자 일치 통과</text>

  <path d="M 316 124 V 164" fill="none" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr-flow)" />

  <!-- Step 3: Policy Match -->
  <g transform="translate(220, 168)">
    <rect width="192" height="148" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
    <text x="20" y="28" fill="#0f172a" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">로케일 검증 정책 매칭</text>

    <rect x="16" y="40" width="160" height="42" rx="4" fill="#ffffff" stroke="#e2e8f0" />
    <text x="24" y="58" fill="#0f172a" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">내장 스크립트 규칙</text>
    <text x="24" y="74" fill="#64748b" font-family="'Geist Mono', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="9.5">ko, en, ja, vi (Built-in)</text>

    <rect x="16" y="90" width="160" height="42" rx="4" fill="#ffffff" stroke="#e2e8f0" />
    <text x="24" y="108" fill="#0f172a" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">CLDR likely-subtags</text>
    <text x="24" y="124" fill="#64748b" font-family="'Geist Mono', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="9.5">ICU4J Script Inference</text>
  </g>

  <path d="M 412 242 H 468" fill="none" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arr-flow)" />

  <!-- Step 4: Regex Cache Test -->
  <g transform="translate(472, 204)">
    <rect width="184" height="76" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2" />
    <text x="20" y="32" fill="#2563eb" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">부정 정규식 캐시 검사</text>
    <text x="20" y="50" fill="#64748b" font-family="'Geist Mono', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="9.5">ConcurrentHashMap Cache</text>
    <text x="20" y="68" fill="#475569" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12">타 언어 문자 즉시 판별</text>
  </g>

  <!-- From Regex to Valid Pass -->
  <path d="M 564 204 V 104 H 720" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arr-green2)" />
  <rect x="588" y="94" width="108" height="20" rx="4" fill="#ffffff" stroke="#bbf7d0" />
  <text x="642" y="108" fill="#16a34a" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">위반 미검출 (정상)</text>

  <!-- Success Terminal Box -->
  <g transform="translate(724, 68)">
    <rect width="156" height="68" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.2" />
    <text x="78" y="36" fill="#16a34a" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" text-anchor="middle">검증 통과 (Valid)</text>
    <text x="78" y="56" fill="#15803d" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">상태 배지 미부착</text>
  </g>

  <!-- From Regex to Violation -->
  <path d="M 656 242 H 720" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr-red2)" />
  <rect x="664" y="232" width="48" height="20" rx="4" fill="#ffffff" stroke="#fecaca" />
  <text x="688" y="246" fill="#dc2626" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">검출</text>

  <!-- Step 5: Diagnostic Box -->
  <g transform="translate(724, 180)">
    <rect width="164" height="136" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.2" />
    <text x="20" y="28" fill="#9f1239" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">진단 메시지 생성</text>

    <rect x="16" y="38" width="132" height="40" rx="4" fill="#fef3c7" stroke="#fde047" />
    <text x="24" y="56" fill="#d97706" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">경고 설정 시 (기본)</text>
    <text x="24" y="70" fill="#d97706" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12">WARNING 배지 (저장 허용)</text>

    <rect x="16" y="84" width="132" height="40" rx="4" fill="#fee2e2" stroke="#fca5a5" />
    <text x="24" y="102" fill="#dc2626" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">에러 설정 시</text>
    <text x="24" y="116" fill="#dc2626" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12">ERROR 배지 (저장 차단)</text>
  </g>
</svg>